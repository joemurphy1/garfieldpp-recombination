docs:
  stage: build
  needs: []
  image: archlinux/archlinux:base-devel
  before_script:
    - pacman-key --init
    - pacman -Syu --noconfirm
    - pacman -S --noconfirm doxygen texlive-bin texlive-basic texlive-latex texlive-latexextra texlive-luatex texlive-fontutils texlive-latexrecommended texlive-bibtexextra texlive-plaingeneric otf-latinmodern-math otf-latin-modern cmake gcc-fortran root cern-vdt biber
  script:
    - cmake -E rm -rf ./build
    - cmake -E make_directory ./build
    - cmake -S . -B ./build -Dbiber_ROOT=usr/bin/vendor_perl/ -D CMAKE_INSTALL_PREFIX:PATH=./install -D GARFIELD_WITH_DOC:BOOL=TRUE -D GARFIELD_WITH_EXAMPLES:BOOL=FALSE -D GARFIELD_WITH_TESTS:BOOL=FALSE
    - cmake --build ./build --config Debug --parallel 5 --target docs
    - cmake --install ./build --config Debug --parallel 5
